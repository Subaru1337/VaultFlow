<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Shared File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 space-y-6 bg-gray-800 rounded-2xl shadow-lg">
        <div id="download-container">
            <h2 class="text-3xl font-bold text-center text-indigo-400">Secure File Download</h2>
            <p class="mt-2 text-center text-sm text-gray-400">Enter the password to decrypt and download the file.</p>
            
            <form id="share-form" class="mt-8 space-y-6">
                <div>
                    <input id="share-password" name="password" type="password" required class="appearance-none relative block w-full px-3 py-3 border border-gray-700 bg-gray-900 placeholder-gray-500 text-white rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Password">
                </div>
                <button type="submit" id="download-button" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-gray-800">
                    <svg id="spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="button-text">Decrypt & Download</span>
                </button>
            </form>
        </div>
        <p id="message" class="text-center text-sm text-red-400 mt-2"></p>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const shareId = '{{ share_id }}';
    const shareForm = document.getElementById('share-form');
    const passwordInput = document.getElementById('share-password');
    const message = document.getElementById('message');
    const downloadButton = document.getElementById('download-button');
    const spinner = document.getElementById('spinner');
    const buttonText = document.getElementById('button-text');

    // --- Core Cryptography Functions (copied from dashboard) ---
    const hexToArrayBuffer = (hex) => {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
            bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        }
        return bytes.buffer;
    };
    
    async function deriveKey(password, saltHex, iterations = 390000) {
        const passwordBuffer = new TextEncoder().encode(password);
        const saltBuffer = hexToArrayBuffer(saltHex);
        const baseKey = await window.crypto.subtle.importKey('raw', passwordBuffer, { name: 'PBKDF2' }, false, ['deriveKey']);
        return await window.crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: saltBuffer, iterations: iterations, hash: 'SHA-256' },
            baseKey, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
        );
    }
    
    async function decryptFile(encryptedBuffer, password, saltHex) {
        try {
            const key = await deriveKey(password, saltHex);
            const iv = encryptedBuffer.slice(0, 12);
            const data = encryptedBuffer.slice(12);
            return await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
        } catch (e) {
            console.error("Decryption failed:", e);
            throw new Error("Decryption failed. Incorrect password or invalid file.");
        }
    }

    shareForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        message.textContent = '';
        const password = passwordInput.value;
        if (!password) {
            message.textContent = 'Please enter a password.';
            return;
        }

        buttonText.textContent = 'Fetching...';
        spinner.classList.remove('hidden');
        downloadButton.disabled = true;

        try {
            // 1. Fetch the encrypted data and salt from the API
            const response = await fetch(`/api/share/${shareId}`);
            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || 'This link has expired or is invalid.');
            }

            buttonText.textContent = 'Decrypting...';
            
            const encryptedBuffer = hexToArrayBuffer(result.encryptedData);
            const decryptedBuffer = await decryptFile(encryptedBuffer, password, result.salt);

            // 3. Trigger browser download
            const blob = new Blob([decryptedBuffer], {type: 'application/octet-stream'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = result.filename; // The original filename
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

            document.getElementById('download-container').innerHTML = `<h2 class="text-2xl font-bold text-center text-green-400">Download Started!</h2><p class="mt-2 text-center text-sm text-gray-400">This secure link has now been destroyed.</p>`;

        } catch (error) {
            message.textContent = error.message;
            buttonText.textContent = 'Decrypt & Download';
            spinner.classList.add('hidden');
            downloadButton.disabled = false;
        }
    });
});
</script>
</body>
</html>
